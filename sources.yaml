# One entry per source: name, url, kind, ai_filter, max_items.
# kind: rss (RSS/Atom via feedparser) or a JSON adapter name from briefing/adapters/json_kinds.py.
# ai_filter: site-wide feeds; items must match the AI keyword filter.
# {since} in a URL is replaced with (today - 7 days) as YYYY-MM-DD.
defaults:
  ai_filter: false
  max_items: 25

sources:
  # --- Labs and company blogs
  - {name: OpenAI, url: "https://openai.com/news/rss.xml", kind: rss}
  - {name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml", kind: rss}
  - {name: Google AI, url: "https://blog.google/technology/ai/rss/", kind: rss}
  - {name: NVIDIA, url: "https://blogs.nvidia.com/feed/", kind: rss}
  - {name: Hugging Face, url: "https://huggingface.co/blog/feed.xml", kind: rss}
  - {name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/feed/", kind: rss}
  - {name: Mistral, url: "https://mistral.ai/rss.xml", kind: rss}
  - {name: Google Research, url: "https://research.google/blog/rss/", kind: rss}
  - {name: OpenAI Developers, url: "https://developers.openai.com/rss.xml", kind: rss}
  - {name: LangChain, url: "https://www.langchain.com/blog/rss.xml", kind: rss}
  - {name: Meta Engineering, url: "https://engineering.fb.com/feed/", kind: rss, ai_filter: true}
  - {name: Google Security Blog, url: "https://security.googleblog.com/feeds/posts/default", kind: rss}
  - {name: MITRE ATLAS, url: "https://github.com/mitre-atlas/atlas-data/releases.atom", kind: rss}

  # --- News
  - {name: TechCrunch AI, url: "https://techcrunch.com/category/artificial-intelligence/feed/", kind: rss}
  - {name: MIT Technology Review, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed", kind: rss}
  - {name: The Decoder, url: "https://the-decoder.com/feed/", kind: rss}
  - {name: Ars Technica AI, url: "https://arstechnica.com/ai/feed/", kind: rss}
  - {name: CNBC Tech, url: "https://www.cnbc.com/id/19854910/device/rss/rss.html", kind: rss, ai_filter: true}

  # --- Research
  - {name: arXiv cs.AI, url: "https://rss.arxiv.org/rss/cs.AI", kind: rss, max_items: 40}
  - {name: Epoch AI, url: "https://epoch.ai/atom.xml", kind: rss}
  - {name: Sebastian Raschka, url: "https://magazine.sebastianraschka.com/feed", kind: rss}
  - {name: HF Daily Papers, url: "https://huggingface.co/api/daily_papers", kind: hf_daily_papers}

  # --- Newsletters and commentary
  - {name: Simon Willison, url: "https://simonwillison.net/atom/everything/", kind: rss}
  - {name: The Rundown, url: "https://www.therundown.ai/feed", kind: rss}
  - {name: TLDR AI, url: "https://tldr.tech/api/rss/ai", kind: rss}
  - {name: "Ben's Bites", url: "https://www.bensbites.com/feed", kind: rss}
  - {name: The Neuron, url: "https://rss.beehiiv.com/feeds/N4eCstxvgX.xml", kind: rss}
  - {name: Latent Space, url: "https://www.latent.space/feed", kind: rss}

  # --- Startups and investors
  - {name: Y Combinator Blog, url: "https://www.ycombinator.com/blog/rss/", kind: rss}
  - {name: Product Hunt, url: "https://www.producthunt.com/feed", kind: rss, ai_filter: true}
  - {name: a16z, url: "https://www.a16z.news/feed", kind: rss}
  - {name: Sequoia, url: "https://sequoiacap.com/feed/", kind: rss}

  # --- Government and regulation
  - {name: White House, url: "https://www.whitehouse.gov/news/feed/", kind: rss, ai_filter: true}
  - {name: NIST, url: "https://www.nist.gov/news-events/news/rss.xml", kind: rss, ai_filter: true}
  - {name: EU Digital Strategy, url: "https://digital-strategy.ec.europa.eu/en/rss.xml", kind: rss, ai_filter: true}
  - {name: FTC, url: "https://www.ftc.gov/feeds/press-release.xml", kind: rss, ai_filter: true}
  - {name: Federal Register, url: "https://www.federalregister.gov/api/v1/documents.json?conditions[term]=%22artificial+intelligence%22&order=newest", kind: federal_register}

  # --- Community, code and models
  - {name: Hacker News, url: "https://hn.algolia.com/api/v1/search_by_date?tags=story&query=AI&numericFilters=points>50", kind: hn_algolia}
  - {name: HF Trending Models, url: "https://huggingface.co/api/models?sort=trendingScore&limit=20", kind: hf_trending_models}
  - {name: GitHub New LLM Repos, url: "https://api.github.com/search/repositories?q=topic:llm+created:>{since}&sort=stars&order=desc&per_page=20", kind: github_search}

  # --- Jobs
  - {name: HN Who is Hiring, url: "https://hnrss.org/whoishiring/jobs", kind: rss, ai_filter: true}
  - {name: Remotive AI Jobs, url: "https://remotive.com/api/remote-jobs?search=AI&limit=30", kind: remotive}
